<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>System Design Course • Day-Wise Revision Hub</title>
  <style>
    :root {
      --bg: #0b1120;
      --surface: #1e293b;
      --surface-light: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #38bdf8;
      --accent-soft: rgba(56, 189, 248, 0.14);
      --green: #4ade80;
      --amber: #fbbf24;
      --border: #2e3b4e;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.65;
      padding-bottom: 3rem;
    }

    /* Sticky Top Header & Day Scroller */
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(11, 17, 32, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1rem 0.65rem;
    }

    .brand-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      max-width: 820px;
      margin: 0 auto 0.75rem;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 700;
      color: #fff;
    }

    .brand-sub {
      font-size: 0.75rem;
      color: var(--accent);
      background: var(--accent-soft);
      padding: 0.2rem 0.6rem;
      border-radius: 999px;
      font-weight: 600;
    }

    /* Horizontal Swipeable Day Pills */
    .day-scroller {
      display: flex;
      gap: 0.5rem;
      overflow-x: auto;
      max-width: 820px;
      margin: 0 auto;
      padding-bottom: 0.25rem;
      scrollbar-width: none;
    }

    .day-scroller::-webkit-scrollbar {
      display: none;
    }

    .day-pill {
      flex: 0 0 auto;
      background: var(--surface);
      color: var(--muted);
      border: 1px solid var(--border);
      padding: 0.45rem 0.95rem;
      border-radius: 999px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }

    .day-pill.active {
      background: var(--accent);
      color: #0b1120;
      border-color: var(--accent);
    }

    .day-pill.locked {
      opacity: 0.55;
    }

    /* Main Container */
    .container {
      max-width: 820px;
      margin: 1.25rem auto 0;
      padding: 0 1rem;
    }

    /* Lecture Header Banner */
    .lecture-hero {
      background: linear-gradient(135deg, #1e293b 0%, #131c31 100%);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 1.35rem;
      margin-bottom: 1.25rem;
    }

    .lecture-tag {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--accent);
      margin-bottom: 0.35rem;
    }

    .lecture-hero h1 {
      font-size: 1.45rem;
      line-height: 1.3;
      margin-bottom: 0.4rem;
    }

    .lecture-meta {
      font-size: 0.85rem;
      color: var(--muted);
    }

    /* Cards & Accordions */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem;
      margin-bottom: 1rem;
    }

    .card h2 {
      font-size: 1.1rem;
      color: var(--accent);
      margin-bottom: 0.65rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .card p, .card li {
      font-size: 0.95rem;
      color: #e2e8f0;
    }

    .card ul {
      padding-left: 1.2rem;
      margin-top: 0.4rem;
    }

    .card li {
      margin-bottom: 0.45rem;
    }

    code {
      background: rgba(56, 189, 248, 0.12);
      color: var(--accent);
      padding: 0.15rem 0.4rem;
      border-radius: 5px;
      font-size: 0.88rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    /* Accordion List */
    .principle-item {
      background: #162033;
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 0.6rem;
      overflow: hidden;
    }

    .principle-header {
      padding: 0.85rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      font-weight: 600;
      font-size: 0.95rem;
    }

    .principle-num {
      color: var(--accent);
      margin-right: 0.5rem;
      font-weight: 700;
    }

    .principle-body {
      padding: 0 1rem 0.9rem;
      font-size: 0.9rem;
      color: var(--muted);
      display: none;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 0.6rem;
    }

    .principle-item.open .principle-body {
      display: block;
    }

    /* Mobile-Friendly Comparison Cards */
    .vs-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 0.85rem;
      margin-top: 0.75rem;
    }

    @media (min-width: 640px) {
      .vs-grid {
        grid-template-columns: 1fr 1fr;
      }
      .lecture-hero h1 {
        font-size: 1.75rem;
      }
    }

    .vs-box {
      background: #162033;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1rem;
    }

    .vs-box h3 {
      font-size: 1rem;
      margin-bottom: 0.5rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .pill-green {
      font-size: 0.72rem;
      background: rgba(74, 222, 128, 0.15);
      color: var(--green);
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
    }

    .pill-amber {
      font-size: 0.72rem;
      background: rgba(251, 191, 36, 0.15);
      color: var(--amber);
      padding: 0.15rem 0.5rem;
      border-radius: 6px;
    }

    /* Interactive Flashcard */
    .flashcard {
      background: linear-gradient(145deg, #1e293b, #162033);
      border: 1.5px solid var(--accent);
      border-radius: 14px;
      padding: 1.75rem 1.25rem;
      text-align: center;
      min-height: 170px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      cursor: pointer;
      user-select: none;
    }

    .fc-hint {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--accent);
      margin-bottom: 0.65rem;
    }

    .fc-text {
      font-size: 1.05rem;
      font-weight: 600;
    }

    .fc-nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.85rem;
      gap: 0.5rem;
    }

    .btn {
      background: var(--surface-light);
      color: #fff;
      border: none;
      padding: 0.6rem 1rem;
      border-radius: 10px;
      font-size: 0.88rem;
      font-weight: 600;
      cursor: pointer;
      flex: 1;
    }

    .btn:active {
      background: var(--accent);
      color: #0b1120;
    }

    /* Checklist */
    .check-row {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
      padding: 0.7rem 0;
      border-bottom: 1px solid var(--border);
    }

    .check-row:last-child {
      border-bottom: none;
    }

    .check-row input {
      margin-top: 0.25rem;
      width: 18px;
      height: 18px;
      accent-color: var(--accent);
      flex-shrink: 0;
    }

    .check-row.done label {
      text-decoration: line-through;
      color: var(--muted);
    }

    /* Empty State for Future Days */
    .coming-soon {
      text-align: center;
      padding: 3rem 1.5rem;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: 16px;
    }

    .coming-soon h2 {
      color: var(--accent);
      margin-bottom: 0.5rem;
    }

    .coming-soon p {
      color: var(--muted);
      font-size: 0.92rem;
    }
  </style>
</head>

        title: "SQL vs NoSQL Databases: What, When, Why",

        status: "completed",
        coreTakeaways: [
          {
            heading: "1. SQL (Relational) Databases & ACID Properties",
            body: "Databases like <strong>PostgreSQL</strong> and <strong>MySQL</strong> organize data into structured tables (rows & columns) with predefined schemas (<strong>Schema-on-Write</strong>) and link tables via <strong>JOINs</strong>.<br><strong>ACID Guarantees:</strong> <code>Atomicity</code> (all or nothing), <code>Consistency</code> (valid state rules), <code>Isolation</code> (concurrent transactions don't clash), and <code>Durability</code> (saved permanently on disk)."
          },
          {
            heading: "2. Why NoSQL & The BASE Consistency Model",
            body: "NoSQL ('Not Only SQL') databases sacrifice complex JOINs and rigid schemas to achieve effortless <strong>Horizontal Scaling</strong> and high speed for massive, rapidly changing data.<br><strong>BASE Model:</strong> <code>Basically Available</code> (always responds), <code>Soft State</code> (state may change over time), <code>Eventual Consistency</code> (all nodes sync up shortly rather than instantaneously)."
          },
          {
            heading: "3. Real-World Hybrid Strategy (Polyglot Persistence)",
            body: "Modern apps like <strong>Zomato</strong> or Amazon don't pick just one—they combine both: <strong>SQL</strong> for payments & order transactions (strict ACID), and <strong>NoSQL</strong> for restaurant menus, live sessions, and high-speed caching."

          { q: "Name the 4 types of NoSQL databases with one example each.", a: "1. Key-Value (Redis), 2. Document (MongoDB), 3. Wide-Column (Cassandra), 4. Graph (Neo4j)." },
          { q: "Why is horizontally scaling a traditional SQL database difficult?", a: "SQL relies on relational tables and cross-table JOINs with strict ACID locks; splitting tables across servers breaks JOIN performance." },

        coreTakeaways: [
          {
            heading: "1. Full Table Scan vs. Index & Disk Pages",
            body: "Without an index, finding a user runs a slow <strong>Full Table Scan O(N)</strong> across disk blocks. Databases read/write fixed chunks called <strong>Disk Pages (4KB–16KB)</strong>. An <strong>Index</strong> acts like a textbook's back index—storing a sorted lookup key + disk pointer so queries jump straight to the target page in milliseconds."
          },
          {
            heading: "2. Types of Indexes & Leftmost Prefix Rule",
            body: "<strong>Clustered Index:</strong> Physically sorts actual table rows on disk (usually Primary Key; only <strong>1 per table</strong>).<br><strong>Non-Clustered (Secondary) Index:</strong> Separate sorted structure pointing back to the Primary Key (can have <strong>many</strong>, e.g., on <code>email</code>).<br><strong>Composite Index (A, B, C):</strong> Follows the <strong>Leftmost Prefix Rule</strong>—works for <code>(A)</code>, <code>(A,B)</code>, or <code>(A,B,C)</code>, but fails if <code>A</code> is skipped."
          },
          {
            heading: "3. Trade-Offs: Read Speed vs. Write Overhead",
            body: "Every index speeds up <code>SELECT</code> queries, but slows down <code>INSERT</code>, <code>UPDATE</code>, and <code>DELETE</code> (every attached index must also be updated) and consumes extra SSD & RAM. Index <strong>High Cardinality</strong> columns (<code>email</code>, <code>user_id</code>), and avoid indexing Low Cardinality booleans (<code>is_active</code>)."
          }
        ],
        accordionTitle: "3 Indexing Data Structures (Tap to expand)",
        accordionItems: [
          { num: "01", title: "Hash Index — O(1) Exact Lookups", desc: "In-memory hash map pointing keys directly to disk offsets. Blazingly fast for exact equality (WHERE id = 105), but cannot handle range queries (BETWEEN) or sorting (ORDER BY)." },
          { num: "02", title: "B+ Tree — Standard for SQL (PostgreSQL, MySQL)", desc: "Self-balancing multi-way tree only 3–4 levels deep for billions of rows. Internal nodes hold routing keys; all data pointers live in Leaf Nodes connected via a Doubly Linked List for super-fast range scans." },
          { num: "03", title: "LSM Tree — Built for Write-Heavy NoSQL (Cassandra, RocksDB)", desc: "Writes go sequentially to an in-memory MemTable (+ WAL) and flush to immutable sorted SSTables on disk, merged later via background Compaction. Maximizes sequential write throughput." }

          },
          right: {

          }
        },

          { q: "What happens if you add 15 indexes to a write-heavy table?", a: "Every INSERT, UPDATE, or DELETE becomes much slower because the database must update and rebalance all 15 index trees on every write." }
        ],
        checklist: [

        ]

      {
        day: 8,
        label: "Day 8: Next Lecture",

      {
        day:9,
        label: "give ur idea",
        title: "no idea",

    // =========================================================================
    // ⚙️ APP RENDERING & INTERACTIVITY LOGIC
    // =========================================================================
    let activeDayIndex = 6; // Opens directly on Day 7!
    let fcIndex = 0;
    let fcFlipped = false;

    function init() {
      renderDayScroller();
      renderDayContent(activeDayIndex);
    }

    function renderDayScroller() {
      const scroller = document.getElementById("day-scroller");
      scroller.innerHTML = courseData.map((item, idx) => `
        <button 
          class="day-pill ${idx === activeDayIndex ? 'active' : ''} ${item.status === 'upcoming' ? 'locked' : ''}" 
          onclick="selectDay(${idx})">
          Day ${item.day}
        </button>
      `).join("");
    }

    function selectDay(idx) {
      activeDayIndex = idx;
      fcIndex = 0;
      fcFlipped = false;
      renderDayScroller();
      renderDayContent(idx);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function renderDayContent(idx) {
      const data = courseData[idx];
      const container = document.getElementById("app-content");

      if (data.status === "upcoming") {
        container.innerHTML = `
          <div class="lecture-hero">
            <div class="lecture-tag">Day ${data.day} • ${data.duration}</div>
            <h1>${data.title}</h1>
          </div>
          <div class="coming-soon">
            <h2>Ready for Day ${data.day} Notes</h2>
            <p>Watch Lecture ${data.day} and ask me to summarize it—we will plug your notes straight into this slot!</p>
          </div>
        `;
        return;
      }

      // Build Core Takeaways
      const takeawaysHTML = data.coreTakeaways.map(t => `
        <div class="card">
          <h2>${t.heading}</h2>
          <p>${t.body}</p>
        </div>
      `).join("");

      // Build Accordion Section
      const accordionHTML = data.accordionItems ? `
        <div class="card">
          <h2>${data.accordionTitle}</h2>
          <div style="margin-top: 0.75rem;">
            ${data.accordionItems.map((p, i) => `
              <div class="principle-item ${i === 0 ? 'open' : ''}" onclick="this.classList.toggle('open')">
                <div class="principle-header">
                  <span><span class="principle-num">${p.num}</span> ${p.title}</span>
                  <span style="color: var(--muted); font-size: 0.8rem;">▼</span>
                </div>
                <div class="principle-body">${p.desc}</div>
              </div>
            `).join("")}
          </div>
        </div>
      ` : "";

      // Build Case Study / Comparison
      const caseStudyHTML = data.caseStudy ? `
        <div class="card">
          <h2>${data.caseStudy.title}</h2>
          <div class="vs-grid">
            <div class="vs-box">
              <h3>${data.caseStudy.left.name} <span class="pill-${data.caseStudy.left.badgeType}">${data.caseStudy.left.badge}</span></h3>
              <ul>${data.caseStudy.left.points.map(pt => `<li>${pt}</li>`).join("")}</ul>
            </div>
            <div class="vs-box">
              <h3>${data.caseStudy.right.name} <span class="pill-${data.caseStudy.right.badgeType}">${data.caseStudy.right.badge}</span></h3>
              <ul>${data.caseStudy.right.points.map(pt => `<li>${pt}</li>`).join("")}</ul>
            </div>
          </div>
        </div>
      ` : "";

      // Build Flashcards
      const flashcardsHTML = data.flashcards ? `
        <div class="card">
          <h2>Quick Recall Flashcards</h2>
          <div class="flashcard" onclick="flipCard()">
            <div class="fc-hint" id="fc-hint">Question (Tap card to flip)</div>
            <div class="fc-text" id="fc-text">${data.flashcards[0].q}</div>
          </div>
          <div class="fc-nav">
            <button class="btn" onclick="prevCard()">← Prev</button>
            <span id="fc-count" style="font-size: 0.85rem; color: var(--muted); font-weight: 600;">1 / ${data.flashcards.length}</span>
            <button class="btn" onclick="nextCard()">Next →</button>
          </div>
        </div>
      ` : "";

      // Build Checklist
      const checklistHTML = data.checklist ? `
        <div class="card">
          <h2>Day ${data.day} Revision Checklist</h2>
          <div style="margin-top: 0.5rem;">
            ${data.checklist.map((item, i) => {
              const key = `sd_day${data.day}_chk_${i}`;
              const checked = localStorage.getItem(key) === "true";
              return `
                <div class="check-row ${checked ? 'done' : ''}">
                  <input type="checkbox" id="${key}" ${checked ? 'checked' : ''} onchange="toggleCheck('${key}', this)">
                  <label for="${key}">${item}</label>
                </div>
              `;
            }).join("")}
          </div>
        </div>
      ` : "";

      container.innerHTML = `
        <div class="lecture-hero">
          <div class="lecture-tag">Day ${data.day} • ${data.duration}</div>
          <h1>${data.title}</h1>
          <div class="lecture-meta">Tap any item below to expand • Progress saves automatically</div>
        </div>
        ${takeawaysHTML}
        ${accordionHTML}
        ${caseStudyHTML}
        ${flashcardsHTML}
        ${checklistHTML}
      `;
    }

    function flipCard() {
      const cards = courseData[activeDayIndex].flashcards;
      fcFlipped = !fcFlipped;
      document.getElementById("fc-hint").innerText = fcFlipped ? "Answer (Tap to flip back)" : "Question (Tap card to flip)";
      document.getElementById("fc-text").innerText = fcFlipped ? cards[fcIndex].a : cards[fcIndex].q;
    }

    function nextCard() {
      const cards = courseData[activeDayIndex].flashcards;
      fcIndex = (fcIndex + 1) % cards.length;
      fcFlipped = false;
      updateCardUI();
    }

    function prevCard() {
      const cards = courseData[activeDayIndex].flashcards;
      fcIndex = (fcIndex - 1 + cards.length) % cards.length;
      fcFlipped = false;
      updateCardUI();
    }

    function updateCardUI() {
      const cards = courseData[activeDayIndex].flashcards;
      document.getElementById("fc-hint").innerText = "Question (Tap card to flip)";
      document.getElementById("fc-text").innerText = cards[fcIndex].q;
      document.getElementById("fc-count").innerText = `${fcIndex + 1} / ${cards.length}`;
    }

    function toggleCheck(key, el) {
      localStorage.setItem(key, el.checked);
      el.parentElement.classList.toggle("done", el.checked);
    }

    init();
  </script>
